<!doctype html>
<html><head><meta charset="utf-8"><title>Phone 3D Search</title>
<style>
@font-face{font-family:"Outfit";src:url(../fonts/Outfit.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:"JBM";src:url(../fonts/JetBrainsMono.woff2) format("woff2");font-weight:100 800}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#F2F2EE}
#stage{position:absolute;inset:0;perspective:1800px;perspective-origin:50% 50%;overflow:hidden;
  background:radial-gradient(1200px 800px at 45% 40%,#ffffff 0%,#F4F6EE 45%,#E9ECE3 100%)}
#glow{position:absolute;inset:0;background:radial-gradient(700px 500px at 40% 45%,rgba(210,251,149,.45),rgba(210,251,149,0) 70%)}
#bokeh{position:absolute;inset:0}
.bk{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(210,251,149,.9),rgba(210,251,149,0) 70%)}
#world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.o{position:absolute;left:0;top:0;transform-style:preserve-3d;will-change:transform,filter}
/* phone */
#phone{width:420px;height:880px}
.ph-layer{position:absolute;inset:0;border-radius:72px;background:linear-gradient(135deg,#d9dbd6,#9ea19b 40%,#c9cbc6 60%,#8d908a)}
.ph-body{position:absolute;inset:0;border-radius:72px;background:linear-gradient(135deg,#2a2c30,#0d0e10 50%,#26282b);box-shadow:0 60px 120px rgba(0,0,0,.25),0 20px 40px rgba(0,0,0,.15)}
.ph-screen{position:absolute;left:14px;top:14px;right:14px;bottom:14px;border-radius:60px;overflow:hidden;background:#fff}
.island{position:absolute;left:50%;top:18px;width:120px;height:36px;margin-left:-60px;border-radius:20px;background:#000;z-index:20}
.glare{position:absolute;inset:0;border-radius:60px;pointer-events:none;z-index:30;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.22) 45%,rgba(255,255,255,0) 60%)}
.status{position:absolute;left:0;right:0;top:20px;height:30px;font:600 17px Outfit;color:#111;padding:0 40px;display:flex;justify-content:space-between;z-index:10}
/* home screen */
#home{position:absolute;inset:0;background:linear-gradient(160deg,#e9f7d0 0%,#d2fb95 35%,#a8d86a 70%,#6f9a3a 100%)}
.grid{position:absolute;left:26px;right:26px;top:90px;display:grid;grid-template-columns:repeat(4,1fr);row-gap:26px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font:500 12.5px Outfit;color:#132}
.ic{width:70px;height:70px;border-radius:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.12);position:relative;overflow:hidden}
.ic svg{width:40px;height:40px}
.dock{position:absolute;left:18px;right:18px;bottom:22px;height:98px;border-radius:34px;background:rgba(255,255,255,.35);backdrop-filter:blur(8px);display:flex;justify-content:space-around;align-items:center}
.badge{position:absolute;top:-6px;right:-6px;background:#ff3b30;color:#fff;font:700 12px Outfit;border-radius:10px;padding:1px 6px}
#ripple{position:absolute;width:20px;height:20px;border-radius:50%;border:4px solid #D2FB95;opacity:0;z-index:40}
/* google app inside the phone */
#gapp{position:absolute;inset:0;background:#fff;opacity:0}
.gword{font:500 64px "Inter Display",Inter,sans-serif;letter-spacing:-2px}
.gpill{border-radius:40px;border:1.5px solid #dfe1e5;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08);display:flex;align-items:flex-start;gap:14px;padding:18px 22px;font:400 20px Outfit;color:#202124}
.tile{width:66px;height:66px;border-radius:50%;background:#f1f3f4;display:flex;align-items:center;justify-content:center}
/* floating 3D UI */
.card{background:#fff;border-radius:28px;box-shadow:0 30px 60px rgba(0,0,0,.12),0 8px 20px rgba(0,0,0,.08)}
.pill{border-radius:999px;font:700 22px JBM;letter-spacing:4px;padding:16px 30px;white-space:nowrap}
.res{width:420px;height:120px;padding:22px 26px}
.res .l1{height:16px;width:62%;border-radius:8px;background:#dadce0}
.res .l2{height:12px;width:82%;border-radius:6px;background:#e8eaed;margin-top:14px}
.res .l3{height:12px;width:48%;border-radius:6px;background:#e8eaed;margin-top:10px}
.res .x{position:absolute;right:26px;top:36px;width:34px;height:34px}
.word{font:800 150px "Inter Display",Inter,sans-serif;letter-spacing:-6px;color:#121317;white-space:nowrap}
#full{position:absolute;inset:0;opacity:0;background:#000}
#full img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cap{position:absolute;left:0;right:0;bottom:90px;text-align:center;font:800 60px "Inter Display",Inter,sans-serif;color:#F4F4F0;text-shadow:0 4px 18px rgba(0,0,0,.85)}
#cap .cur{color:#D2FB95}#cap .off{opacity:.55}
#flash{position:absolute;inset:0;background:#D2FB95;opacity:0;pointer-events:none}
#fade{position:absolute;inset:0;background:#fff;opacity:1;pointer-events:none}
</style></head>
<body>
<div id="stage">
  <div id="glow"></div><div id="bokeh"></div>
  <div id="world">
    <!-- the phone -->
    <div class="o" id="phone">
      <div class="ph-layer" style="transform:translateZ(-16px)"></div><div class="ph-layer" style="transform:translateZ(-12px)"></div>
      <div class="ph-layer" style="transform:translateZ(-8px)"></div><div class="ph-layer" style="transform:translateZ(-4px)"></div>
      <div class="ph-body"></div>
      <div class="ph-screen" id="screen">
        <div class="status"><span>9:41</span><span>●●● ▮</span></div><div class="island"></div>
        <div id="home"><div class="grid" id="grid"></div><div class="dock" id="dock"></div></div>
        <div id="gapp">
          <div id="g-logo" style="position:absolute;left:0;right:0;top:250px;text-align:center"></div>
          <div id="g-pill" class="gpill" style="position:absolute;left:24px;right:24px;top:350px"><span>🔍</span><span style="color:#9aa0a6">Search Google or type a URL</span></div>
          <div id="g-tiles" style="position:absolute;left:30px;right:30px;top:450px;display:flex;justify-content:space-between"></div>
        </div>
        <div id="ripple"></div>
        <div class="glare" id="glare"></div>
      </div>
    </div>
    <!-- floating pieces that explode out of the phone -->
    <div class="o" id="fLogo"></div>
    <div class="o card" id="fSearch" style="width:1000px;padding:34px 44px;display:flex;gap:26px;align-items:flex-start">
      <svg width="46" height="46" viewBox="0 0 24 24" style="flex:none;margin-top:6px"><circle cx="10" cy="10" r="7" fill="none" stroke="#5f6368" stroke-width="2.4"/><path d="M15 15l6 6" stroke="#5f6368" stroke-width="2.4" stroke-linecap="round"/></svg>
      <div id="qtext" style="font:500 50px Outfit;color:#202124;line-height:1.22;min-height:61px"></div>
    </div>
    <div class="o" id="fTiles" style="display:flex;gap:40px"></div>
    <div class="o card" id="fStatus" style="padding:26px 40px;font:600 46px Outfit;color:#121317;white-space:nowrap">On it. Searching…</div>
    <div class="o pill" id="fCount" style="background:#121317;color:#D2FB95">SCANNING 0 ANSWERS</div>
    <div id="results" class="o"></div>
    <div class="o word" id="wFound">Found</div>
    <div class="o word" id="wIt">it.<div id="itLine" style="position:absolute;left:0;bottom:18px;height:22px;width:0;background:#D2FB95;z-index:-1;border-radius:6px"></div></div>
    <div class="o card" id="fCard" style="width:760px;height:428px;overflow:hidden;padding:0">
      <img id="cardImg" style="width:100%;height:100%;object-fit:cover;display:block">
      <div style="position:absolute;inset:0;background:rgba(0,0,0,.22)"></div>
      <div id="play" style="position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:#D2FB95;display:flex;align-items:center;justify-content:center"><div style="width:0;height:0;border-left:42px solid #121317;border-top:26px solid transparent;border-bottom:26px solid transparent;margin-left:10px"></div></div>
      <div style="position:absolute;left:24px;bottom:22px;background:rgba(0,0,0,.65);color:#fff;font:700 18px JBM;letter-spacing:3px;padding:8px 16px;border-radius:20px">VIDEO · @emuch4pf</div>
    </div>
    <svg class="o" id="circle" width="1000" height="640" viewBox="0 0 1000 640" style="overflow:visible"><path id="cpath" fill="none" stroke="#121317" stroke-width="9" stroke-linecap="round"/></svg>
    <div class="o pill" id="fFoundPill" style="background:#D2FB95;color:#121317">1 RESULT FOUND</div>
  </div>
  <div id="full"><img id="fullImg"><div id="cap"></div></div>
  <div id="flash"></div><div id="fade"></div>
</div>
<script>
// ---------------- timeline ----------------
const Q='Can you find me a video that explains everything I need to know about Tessera before I start?';
const T_TAP=2.2,T_OPEN=2.28,OPEN_D=.55,T_EXPL=3.0,EXPL_D=.8,T_TYPE=3.85,TYPE_D=2.8,T_ENTER=6.85,T_SCAN=6.95,T_PAUSE=8.5,T_FOUND=8.7,T_DIVE=9.75,DIVE_D=.6,T_PLAY=T_DIVE+DIVE_D,CLIP0=1.7,CLIP_END=7.35;
const END=T_PLAY+(CLIP_END-CLIP0);
const PERSP=1800;let WORDS=[];
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-cl(t),3),eio=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2},eo5=t=>1-Math.pow(1-cl(t),5);
const back=t=>{t=cl(t);const c1=1.4,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const $=id=>document.getElementById(id);
// ---------------- build home screen ----------------
const APPS=[['Messages','#34c759','msg'],['Calendar','#fff','cal'],['Photos','#fff','pho'],['Camera','#8e8e93','cam'],
 ['Weather','#3a8dde','sun'],['Clock','#111','clk'],['Maps','#e9f2e2','map'],['Notes','#ffd60a','note'],
 ['Music','#fa2d55','mus'],['Wallet','#111','wal'],['Mail','#2f7cf6','mail'],['Tessera','#121317','tess'],
 ['Google','#fff','goo'],['Settings','#8e8e93','set'],['Podcasts','#9b51e0','pod'],['Health','#fff','hea'],
 ['Files','#2f7cf6','fil'],['Stocks','#111','sto'],['Books','#ff9500','boo'],['TV','#111','tv']];
const DOCK=[['Phone','#34c759','tel'],['Safari','#fff','saf'],['Chat','#2f7cf6','msg'],['Music','#fa2d55','mus']];
let MARKPATH='';
function glyph(k){const W='#fff';switch(k){
 case 'msg':return`<svg viewBox="0 0 40 40"><path d="M20 8c-8 0-14 5-14 11 0 3.5 2 6.6 5.3 8.6L10 33l6-3c1.3.3 2.6.5 4 .5 8 0 14-5 14-11S28 8 20 8z" fill="${W}"/></svg>`;
 case 'cal':return`<svg viewBox="0 0 40 40"><text x="20" y="13" font-family="Outfit" font-size="9" font-weight="700" fill="#ff3b30" text-anchor="middle">FRI</text><text x="20" y="33" font-family="Outfit" font-size="20" font-weight="400" fill="#111" text-anchor="middle">28</text></svg>`;
 case 'pho':return`<svg viewBox="0 0 40 40">${[['#ff9500',0],['#ffcc00',45],['#34c759',90],['#00c7be',135],['#2f7cf6',180],['#5856d6',225],['#af52de',270],['#ff2d55',315]].map(([c,a])=>`<ellipse cx="20" cy="11" rx="5" ry="9" fill="${c}" opacity=".85" transform="rotate(${a} 20 20)"/>`).join('')}</svg>`;
 case 'cam':return`<svg viewBox="0 0 40 40"><rect x="6" y="12" width="28" height="19" rx="4" fill="#1c1c1e"/><circle cx="20" cy="21.5" r="6" fill="#3a3a3c" stroke="#8e8e93" stroke-width="2"/></svg>`;
 case 'sun':return`<svg viewBox="0 0 40 40"><circle cx="17" cy="17" r="7" fill="#ffd60a"/><path d="M14 30h16a6 6 0 0 0 0-12 8 8 0 0 0-15 3 4.5 4.5 0 0 0-1 9z" fill="${W}"/></svg>`;
 case 'clk':return`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="14" fill="${W}"/><path d="M20 10v10l7 4" stroke="#111" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>`;
 case 'map':return`<svg viewBox="0 0 40 40"><path d="M4 28L36 10" stroke="#ffcc00" stroke-width="5"/><path d="M10 4l20 32" stroke="#fff" stroke-width="4"/><path d="M26 14a5 5 0 1 0-10 0c0 4 5 10 5 10s5-6 5-10z" fill="#2f7cf6"/></svg>`;
 case 'note':return`<svg viewBox="0 0 40 40"><rect x="7" y="7" width="26" height="26" rx="3" fill="#fff"/><path d="M11 15h18M11 21h18M11 27h12" stroke="#c7c7cc" stroke-width="2"/></svg>`;
 case 'mus':return`<svg viewBox="0 0 40 40"><path d="M16 28V12l14-3v16" stroke="${W}" stroke-width="3" fill="none"/><circle cx="13" cy="28" r="4" fill="${W}"/><circle cx="27" cy="25" r="4" fill="${W}"/></svg>`;
 case 'wal':return`<svg viewBox="0 0 40 40"><rect x="7" y="9" width="26" height="8" rx="2" fill="#ff9500"/><rect x="7" y="13" width="26" height="8" rx="2" fill="#34c759"/><rect x="7" y="17" width="26" height="8" rx="2" fill="#2f7cf6"/><rect x="7" y="21" width="26" height="11" rx="3" fill="#e5e5ea"/></svg>`;
 case 'mail':return`<svg viewBox="0 0 40 40"><rect x="6" y="11" width="28" height="19" rx="3" fill="${W}"/><path d="M7 12l13 10 13-10" stroke="#2f7cf6" stroke-width="2" fill="none"/></svg>`;
 case 'tess':return`<svg viewBox="0 0 400 400" style="width:46px;height:46px"><path d="${MARKPATH}" fill="#D2FB95"/></svg>`;
 case 'goo':return`<svg viewBox="0 0 48 48"><path fill="#4285F4" d="M43.6 24.5c0-1.6-.1-2.8-.4-4.1H24v7.6h11.2c-.2 1.9-1.5 4.7-4.3 6.6l6.6 5.1c4-3.7 6.1-9 6.1-15.2z"/><path fill="#34A853" d="M24 44c5.4 0 10-1.8 13.3-4.9l-6.6-5.1c-1.7 1.2-4 2-6.7 2-5.2 0-9.6-3.4-11.2-8.2l-6.8 5.3C9.3 39.7 16.1 44 24 44z"/><path fill="#FBBC05" d="M12.8 27.8c-.4-1.2-.7-2.5-.7-3.8s.2-2.6.6-3.8l-6.8-5.3C4.5 17.7 4 20.8 4 24s.5 6.3 1.9 9.1l6.9-5.3z"/><path fill="#EA4335" d="M24 12c3.8 0 6.3 1.6 7.8 3l5.7-5.6C34 6.2 29.4 4 24 4 16.1 4 9.3 8.3 5.9 14.9l6.8 5.3C14.4 15.4 18.8 12 24 12z"/></svg>`;
 case 'set':return`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="10" fill="none" stroke="${W}" stroke-width="5" stroke-dasharray="4 3"/><circle cx="20" cy="20" r="4" fill="${W}"/></svg>`;
 case 'pod':return`<svg viewBox="0 0 40 40"><circle cx="20" cy="17" r="5" fill="${W}"/><path d="M11 25a11 11 0 1 1 18 0" stroke="${W}" stroke-width="3" fill="none"/><rect x="18" y="23" width="4" height="10" rx="2" fill="${W}"/></svg>`;
 case 'hea':return`<svg viewBox="0 0 40 40"><path d="M20 32s-11-7-11-14a6 6 0 0 1 11-3 6 6 0 0 1 11 3c0 7-11 14-11 14z" fill="#ff2d55"/></svg>`;
 case 'fil':return`<svg viewBox="0 0 40 40"><path d="M7 13h10l3 3h13v15H7z" fill="${W}"/></svg>`;
 case 'sto':return`<svg viewBox="0 0 40 40"><path d="M7 28l8-8 6 5 12-12" stroke="#34c759" stroke-width="3" fill="none"/></svg>`;
 case 'boo':return`<svg viewBox="0 0 40 40"><path d="M8 11c5-2 9-1 12 2 3-3 7-4 12-2v18c-5-2-9-1-12 2-3-3-7-4-12-2z" fill="${W}"/></svg>`;
 case 'tv':return`<svg viewBox="0 0 40 40"><text x="20" y="26" font-family="Outfit" font-size="14" font-weight="700" fill="${W}" text-anchor="middle">tv</text></svg>`;
 case 'tel':return`<svg viewBox="0 0 40 40"><path d="M14 9l4 6-3 3c1.5 3.5 4 6 7 7l3-3 6 4-2 5c-11 0-20-9-20-20z" fill="${W}"/></svg>`;
 case 'saf':return`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="14" fill="#2f7cf6"/><path d="M26 14l-4 8-8 4 4-8z" fill="#fff"/><path d="M22 22l-8 4 4-8z" fill="#ff3b30"/></svg>`;
 } return ''}
function appEl(a,i){const bg=a[1];const badge=(a[0]==='Messages'?'<div class="badge">3</div>':a[0]==='Mail'?'<div class="badge">12</div>':'');
  return `<div class="app" id="app-${a[2]}${i??''}"><div class="ic" style="background:${bg}">${glyph(a[2])}${badge}</div>${i===undefined?'':`<span>${a[0]}</span>`}</div>`}
function gword(sz){return [['G','#4285F4'],['o','#EA4335'],['o','#FBBC05'],['g','#4285F4'],['l','#34A853'],['e','#EA4335']].map(([c,col])=>`<span style="color:${col}">${c}</span>`).join('')}
function tiles(sz){const cs=['#4285F4','#34A853','#FBBC05','#EA4335'];return cs.map(c=>`<div class="tile" style="width:${sz}px;height:${sz}px"><div style="width:${sz*.36}px;height:${sz*.36}px;border-radius:${sz*.1}px;background:${c}"></div></div>`).join('')}
function build(mark){MARKPATH=mark;$('grid').innerHTML=APPS.map((a,i)=>appEl(a,i)).join('');$('dock').innerHTML=DOCK.map(a=>appEl(a)).join('');
  $('g-logo').innerHTML=`<span class="gword">${gword()}</span>`;$('g-tiles').innerHTML=tiles(66);
  $('fLogo').innerHTML=`<span class="gword" style="font-size:140px;letter-spacing:-4px">${gword()}</span>`;$('fTiles').innerHTML=tiles(130);
  let h='';for(let i=0;i<14;i++)h+=`<div class="o card res" id="r${i}"><div class="l1"></div><div class="l2"></div><div class="l3"></div><svg class="x" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="#5f6368" stroke-width="2.6" stroke-linecap="round"/></svg></div>`;$('results').innerHTML=h;
  let b='';const r=rnd(7);for(let i=0;i<34;i++){const s=20+r()*120;b+=`<div class="bk" id="bk${i}" style="width:${s}px;height:${s}px;opacity:${.15+r()*.4}"></div>`}$('bokeh').innerHTML=b;
  // hand-drawn circle path
  let d='';for(let i=0;i<=80;i++){const a=i/80*Math.PI*2.18-1.5,k=1+Math.sin(i*.35)*.025;d+=(i?'L':'M')+(500+Math.cos(a)*470*k).toFixed(1)+','+(320+Math.sin(a)*300*k).toFixed(1)}
  $('cpath').setAttribute('d',d);const L=$('cpath').getTotalLength();$('cpath').style.strokeDasharray=L;$('cpath').dataset.len=L}
function rnd(s){return()=>((s=Math.imul(s^s>>>15,1|s)+0x6D2B79F5|0,(s^s>>>14)>>>0)/4294967296)}
// ---------------- camera ----------------
// keys: [t, distance, rotX, rotY, targetX, targetY, targetZ]
const CAM=[[0,1250,38,-22,30,90,0],[2.1,1500,8,-6,0,20,0],[2.9,1500,4,-3,0,0,0],[3.75,1700,2,6,0,-40,80],[6.8,1450,0,2,0,-40,120],[8.4,1700,0,-2,0,0,0],[8.7,1900,0,0,0,0,0],[9.6,1700,0,0,0,0,0]];
function camAt(t){let i=0;while(i<CAM.length-1&&t>CAM[i+1][0])i++;const a=CAM[i],b=CAM[Math.min(i+1,CAM.length-1)];const k=b===a?0:eio((t-a[0])/(b[0]-a[0]));return a.map((v,j)=>lerp(v,b[j],k))}
let CM=new DOMMatrix();
function setCam(t){let [,dist,rx,ry,tx,ty,tz]=camAt(t);
  // found kick + dive into the card
  if(t>=T_FOUND){const d=t-T_FOUND;dist-=Math.sin(Math.min(1,d/.35)*Math.PI)*90}
  const dv=eio((t-T_DIVE)/DIVE_D);if(dv>0){dist=lerp(dist,CARDZ_D,dv)}
  CM=new DOMMatrix().translate(0,0,-dist+PERSP).rotateAxisAngle(1,0,0,rx).rotateAxisAngle(0,1,0,ry).translate(-tx,-ty,-tz);
  $('world').style.transform=CM.toString()}
let CARDZ_D=420;
function place(id,{x=0,y=0,z=0,rx=0,ry=0,rz=0,s=1,o=1,w=null,h=null,focus=1500,dof=1,maxB=14}){const el=$(id);const W_=w??el.offsetWidth,H_=h??el.offsetHeight;
  el.style.transform=`translate3d(${x-W_/2}px,${y-H_/2}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;el.style.opacity=o;
  const p=CM.transformPoint(new DOMPoint(x,y,z));const depth=PERSP-p.z;const b=dof?Math.min(maxB,Math.abs(depth-focus)/110):0;el.style.filter=b>.4?`blur(${b.toFixed(1)}px)`:'none';el.style.visibility=o<=0.001?'hidden':'visible'}
// ---------------- frame ----------------
const imgCache=new Map();
function clipFrame(n){const k=Math.max(1,Math.min(222,n));return `clip/${String(k).padStart(5,'0')}.jpg`}
async function setImg(el,src){if(el.dataset.src===src)return;el.dataset.src=src;el.src=src;try{await el.decode()}catch(e){}}
async function frame(t){setCam(t);let FOC=camAt(t)[1];if(t>T_EXPL+.3&&t<T_FOUND)FOC=lerp(FOC,FOC-430,eio((t-T_EXPL-.3)/.5));
  // bokeh drift (2D parallax)

  // phone

  place('phone',{x:0,y:0,z:0,rx:lerp(0,6,ex),ry:lerp(0,-14,ex)+Math.sin(t*.6)*1.5,rz:lerp(-4,0,eio(t/2.2)),s:1,o:1-eo((t-T_FOUND+.6)/.4),w:420,h:880,focus:FOC,maxB:10});
  $('glare').style.backgroundPosition=`${-200+t*40}px 0`;
  // tap + app opening out of the Google icon
  const GX=68.5,GY=479;const rp=cl((t-T_TAP)/.45);const R=$('ripple');if(rp>0&&rp<1){R.style.opacity=1-rp;const rs=20+rp*120;R.style.left=(GX-rs/2)+'px';R.style.top=(GY-rs/2)+'px';R.style.width=R.style.height=rs+'px'}else R.style.opacity=0;
  const op=eo5((t-T_OPEN)/OPEN_D);const ga=$('gapp');ga.style.opacity=cl(op*1.6);ga.style.transformOrigin=`${GX}px ${GY}px`;ga.style.transform=`scale(${lerp(.18,1,op)})`;ga.style.borderRadius=lerp(18,0,op)+'px';
  $('home').style.transform=`scale(${lerp(1,1.12,op)})`;$('home').style.opacity=1-cl(op*1.4);
  // explode: Google page pieces leave the phone (inner ones hide as the floating copies take over)
  const inner=1-cl(ex*4);['g-logo','g-pill','g-tiles'].forEach(id=>$(id).style.opacity=t<T_EXPL?1:inner);
  const vis=t>=T_EXPL?1:0,gone=1-eo((t-T_FOUND+.5)/.4);
  place('fLogo',{x:lerp(0,-20,ex),y:lerp(-145,-360,ex),z:lerp(4,180,ex),rx:lerp(0,-8,ex),s:lerp(.46,1,ex),o:vis*gone*(1-eo((t-T_ENTER)/.4)),focus:FOC});
  place('fSearch',{x:lerp(0,0,ex),y:lerp(-40,-60,ex),z:lerp(4,420,ex),rx:lerp(0,-4,ex),ry:lerp(0,4,ex),s:lerp(.37,1,ex),o:vis*gone,focus:FOC});
  place('fTiles',{x:0,y:lerp(55,250,ex),z:lerp(4,160,ex),rx:lerp(0,10,ex),s:lerp(.5,1,ex),o:vis*gone*(1-eo((t-T_ENTER)/.4)),focus:FOC});
  // typing
  const n=Math.floor(cl((t-T_TYPE)/TYPE_D)*Q.length);const cur=(t<T_ENTER&&Math.floor(t*2.6)%2===0)?'<span style="display:inline-block;width:4px;height:52px;background:#121317;vertical-align:-8px;margin-left:3px"></span>':'';
  $('qtext').innerHTML=(t<T_TYPE?'<span style="color:#9aa0a6">Search Google or type a URL</span>':Q.slice(0,n))+cur;
  // searching
  const sa=eo((t-T_ENTER)/.35)*gone;place('fStatus',{x:-260,y:150,z:470,ry:6,s:lerp(.8,1,back((t-T_ENTER)/.4)),o:sa,focus:FOC});
  const cnt=Math.floor(eio(cl((t-T_SCAN)/(T_PAUSE-T_SCAN)))*1284);$('fCount').textContent=`SCANNING ${cnt.toLocaleString('en-US')} ANSWERS`;place('fCount',{x:300,y:160,z:440,ry:-4,o:eo((t-T_SCAN)/.3)*gone,focus:FOC});
  // results stream from deep space past the camera
  const rr=rnd(3);for(let i=0;i<14;i++){const born=T_SCAN+i*.1,k=cl((t-born)/1.5);const side=i%2?1:-1,sx=side*(650+rr()*500),sy=(rr()-.5)*900,rzz=(rr()-.5)*16;
    place('r'+i,{x:sx*lerp(.6,1.2,k),y:sy*lerp(.6,1.2,k),z:lerp(-1800,900,eio(k)),rz:rzz,ry:-side*12,s:1.15,o:(k>0&&k<1?Math.min(1,k*6)*(1-cl((k-.8)/.2)):0)*gone,focus:FOC,maxB:9})}
  // FOUND

  const fly=eo5(fd/.6);
  place('fCard',{x:0,y:0,z:lerp(-1600,0,fly),rx:lerp(18,0,fly),ry:lerp(-25,0,fly),s:1,o:fa*cl(fd/.15),focus:FOC,dof:t<T_DIVE?1:0});

  place('wIt',{x:lerp(600,540,wd),y:0,z:lerp(-300,0,wd),s:1,o:fa*cl((fd-.35)/.2)*(1-eo((t-T_DIVE)/.3)),focus:FOC});

  else full.style.opacity=t>T_DIVE+DIVE_D*.75?cl((t-(T_DIVE+DIVE_D*.75))/(DIVE_D*.25)):0;
  if(t>=T_DIVE+DIVE_D*.75&&t<T_PLAY){await setImg($('fullImg'),clipFrame(Math.floor(CLIP0*30)+1))}

  $('flash').style.opacity=fd>=0&&fd<.12?.55*(1-fd/.12):0;
  let fo=t<.4?1-t/.4:0;if(t>=T_PAUSE&&t<T_FOUND)fo=Math.max(fo,.0);if(t>END-.4)fo=cl((t-(END-.4))/.4);$('fade').style.opacity=fo;
  // the "pause": everything but the search bar dims out for a breath
  if(t>=T_PAUSE&&t<T_FOUND){['fStatus','fCount'].forEach(id=>$(id).style.opacity=0);for(let i=0;i<14;i++)$('r'+i).style.opacity=0}
}
window.init=(w,m)=>{WORDS=w;build(m)};
window.renderAt=async t=>{await frame(t);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)))};
</script></body></html>
