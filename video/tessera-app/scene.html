<!doctype html>
<html><head><meta charset="utf-8"><title>Tessera App Film</title>
<style>
@font-face{font-family:Outfit;font-weight:400;src:url(fonts/outfit-400.woff2) format('woff2')}
@font-face{font-family:Outfit;font-weight:500;src:url(fonts/outfit-500.woff2) format('woff2')}
@font-face{font-family:Outfit;font-weight:600;src:url(fonts/outfit-600.woff2) format('woff2')}
@font-face{font-family:Outfit;font-weight:700;src:url(fonts/outfit-700.woff2) format('woff2')}
@font-face{font-family:Outfit;font-weight:800;src:url(fonts/outfit-800.woff2) format('woff2')}
html,body{margin:0;background:#f4f1ea}canvas{display:block;width:100vw;height:auto}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="brand/icons.js"></script>
<script>
/* Tessera app film (16:9, 30s). Deterministic: renderFrame(t) draws time t in seconds.
   Product-showcase style: big two-line headline left, the Tessera app on a phone right,
   a glossy lime ribbon flowing through, background colour changing per scene. */
const DUR=30, W=1920, H=1080;
const C={cream:'#f4f1ea',paper:'#faf8f3',dark:'#1b2117',lime:'#d2fb95',limeDeep:'#b9ec6a',ink:'#0f0f0d',grey:'#7d7f76',line:'#e7e4dc',
  green:'#2a6a14',mark:'#12121a',sx:'#f7e78c',oa:'#ddf3b3',kl:'#c8e0e8',soon:'#e6e3db'};
const F='Outfit, sans-serif';
const cv=document.getElementById('c'), X=cv.getContext('2d');
const ICON={}; for(const k of ['spacex','openai','kalshi']){const im=new Image();im.src=window.ICON_DATA[k];ICON[k]=im;}

/* ---------- math ---------- */
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), P=(t,a,b)=>cl((t-a)/(b-a)), lerp=(a,b,k)=>a+(b-a)*k;
const eo=x=>1-Math.pow(1-x,3), eo5=x=>1-Math.pow(1-x,5), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const a=1.6,b=a+1;return 1+b*Math.pow(x-1,3)+a*Math.pow(x-1,2)};
const hex=(h)=>{const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]};
const mixc=(a,b,k)=>{const A=hex(a),B=hex(b);return `rgb(${lerp(A[0],B[0],k)|0},${lerp(A[1],B[1],k)|0},${lerp(A[2],B[2],k)|0})`};
const rgba=(h,a)=>{const A=hex(h);return `rgba(${A[0]},${A[1]},${A[2]},${a})`};
function font(c,s,w=600,ls){c.font=`${w} ${s}px ${F}`;c.letterSpacing=(ls??-s*0.03)+'px'}
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,Math.max(0,Math.min(r,w/2,h/2)))}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- scenes ---------- */
// [start, background, ribbon preset]
const SC=[
  {t:0,    bg:C.cream, dark:0},
  {t:9.0,  bg:C.dark,  dark:1},
  {t:12.0, bg:C.cream, dark:0},
  {t:16.0, bg:C.lime,  dark:0},
  {t:19.5, bg:C.dark,  dark:1},
  {t:22.0, bg:C.cream, dark:0},
];
const sceneAt=t=>{let i=0;for(let k=0;k<SC.length;k++)if(t>=SC[k].t)i=k;return i};
const WIPE=0.42;

/* ---------- Tessera mark + wordmark ---------- */
const K3=Math.sqrt(3)/2, Pi=(x,y,z)=>[(x-y)*K3,(x+y)/2-z];
const fT=(x,y,z)=>[Pi(x,y,z+1),Pi(x+1,y,z+1),Pi(x+1,y+1,z+1),Pi(x,y+1,z+1)];
const fR=(x,y,z)=>[Pi(x+1,y,z+1),Pi(x+1,y+1,z+1),Pi(x+1,y+1,z),Pi(x+1,y,z)];
const fL=(x,y,z)=>[Pi(x,y+1,z+1),Pi(x+1,y+1,z+1),Pi(x+1,y+1,z),Pi(x,y+1,z)];
const FACES=[[fT(-1,0,0),[-1,-1]],[fT(0,-1,0),[1,-1]],[fT(0,0,0),[0,-1.2]],[fL(-1,0,0),[-1.2,0]],[fR(0,-1,0),[1.2,0]],
  [fL(0,0,0),[-1,.4]],[fR(0,0,0),[1,.4]],[fL(0,0,-1),[-.8,1.2]],[fR(0,0,-1),[.8,1.2]]].map(([pts,from])=>{
  const cx=pts.reduce((a,p)=>a+p[0],0)/4, cy=pts.reduce((a,p)=>a+p[1],0)/4, s=(Math.sqrt(3)/4-0.075)/(Math.sqrt(3)/4);
  return {pts:pts.map(([x,y])=>[cx+(x-cx)*s,cy+(y-cy)*s]),from}});
function mark(c,cx,cy,size,assemble=1,color=C.mark){const u=size/3.8;
  FACES.forEach((f,i)=>{const k=cl((assemble-i/9*0.55)/0.45),d=(1-eo5(k))*2.4;if(k<=0)return;
    c.save();c.globalAlpha*=Math.min(1,k*2.5);c.fillStyle=color;c.beginPath();
    f.pts.forEach(([x,y],j)=>{const px=cx+(x+f.from[0]*d)*u,py=cy+(y-.25+f.from[1]*d)*u;j?c.lineTo(px,py):c.moveTo(px,py)});c.closePath();c.fill();c.restore()})}
function wordmark(c,x,y,size,color=C.ink,align='left'){font(c,size,700,-size*0.04);const w=c.measureText('tessera').width,d=c.measureText('.').width;
  const x0=align==='center'?x-(w+d)/2:x;c.textBaseline='alphabetic';c.textAlign='left';c.fillStyle=color;c.fillText('tessera',x0,y);c.fillStyle=color===C.ink?C.green:C.lime;c.fillText('.',x0+w,y);return w+d}

/* ---------- background + grain ---------- */
const grain=(()=>{const o=document.createElement('canvas');o.width=480;o.height=270;const g=o.getContext('2d'),id=g.createImageData(480,270),r=rng(9);
  for(let i=0;i<id.data.length;i+=4){const v=r()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}g.putImageData(id,0,0);return o})();
function background(c,t){
  const i=sceneAt(t), s=SC[i];
  c.fillStyle=(i>0&&t<s.t+WIPE)?SC[i-1].bg:s.bg; c.fillRect(0,0,W,H);
  if(i>0&&t<s.t+WIPE){ // new colour sweeps up from the bottom with a soft curved edge
    const k=eio(P(t,s.t,s.t+WIPE)), y=lerp(H+120,-160,k);
    c.fillStyle=s.bg;c.beginPath();c.moveTo(0,H);c.lineTo(0,y+60);c.quadraticCurveTo(W/2,y-80,W,y+60);c.lineTo(W,H);c.closePath();c.fill();
  }
}
function finish(c,t,frame){c.save();c.globalAlpha=0.035;c.globalCompositeOperation='overlay';c.drawImage(grain,0,0,W,H);c.restore();
  const f=Math.max(1-P(t,0,0.3),P(t,DUR-0.5,DUR));if(f>0){c.fillStyle=`rgba(244,241,234,${f})`;c.fillRect(0,0,W,H)}}

/* ---------- glossy ribbon ---------- */
// centreline y(x) = base + amp*sin(freq*x + phase); twist angle decides which face shows and how wide it looks.
const RIB=[ // per scene: kept low so it never runs behind the copy
  {base:930,amp:95,freq:0.0030,tw:0.0016,tw0:-1.2,w:230},
  {base:950,amp:110,freq:0.0028,tw:0.0015,tw0:-0.6,w:250},
  {base:945,amp:90,freq:0.0032,tw:0.0017,tw0:-1.6,w:220},
  {base:955,amp:100,freq:0.0029,tw:0.0016,tw0:-0.9,w:240},
  {base:950,amp:100,freq:0.0031,tw:0.0016,tw0:-1.4,w:240},
  {base:830,amp:105,freq:0.0028,tw:0.0015,tw0:-1.0,w:250},
];
function ribbonParams(t){const i=sceneAt(t),s=SC[i];if(i===0)return RIB[0];
  const k=eio(P(t,s.t,s.t+0.8)),A=RIB[i-1],B=RIB[i],o={};for(const key in A)o[key]=lerp(A[key],B[key],k);return o}
function ribbon(c,t,alpha=1,offY=0){
  const p=ribbonParams(t), ph=t*0.9, tph=t*0.7;
  const pts=[];for(let x=-240;x<=W+240;x+=6){const y=p.base+offY+p.amp*Math.sin(p.freq*x+ph)+0.35*p.amp*Math.sin(p.freq*2.3*x-ph*0.6);
    const th=p.tw0+p.tw*x+tph*0.6; pts.push([x,y,Math.cos(th),Math.sin(th)])}
  c.save();c.globalAlpha=alpha;
  // soft shadow
  c.filter='blur(28px)';c.fillStyle='rgba(30,50,10,0.22)';c.beginPath();
  pts.forEach(([x,y],i)=>{i?c.lineTo(x,y+70):c.moveTo(x,y+70)});for(let i=pts.length-1;i>=0;i--)c.lineTo(pts[i][0],pts[i][1]+110);c.fill();c.filter='none';
  for(let i=0;i<pts.length-1;i++){const[a,b]=[pts[i],pts[i+1]];
    const ha=p.w/2*a[2], hb=p.w/2*b[2]; const face=a[2]>=0;
    const lit=Math.abs(a[3]); // edge-on = dark, flat = bright
    const base=face?mixc('#84cf3c','#d6fca0',0.25+0.75*(1-lit)):mixc('#5fae2a','#a6e063',0.7*(1-lit));
    c.fillStyle=base;c.beginPath();c.moveTo(a[0],a[1]-ha);c.lineTo(b[0]+0.6,b[1]-hb);c.lineTo(b[0]+0.6,b[1]+hb);c.lineTo(a[0],a[1]+ha);c.closePath();c.fill();}
  // specular streak along the upper part of the front face
  c.lineCap='round';
  for(let i=0;i<pts.length-1;i++){const[a,b]=[pts[i],pts[i+1]];if(a[2]<0.25)continue;
    const s=Math.pow(1-Math.abs(a[3]),4);c.strokeStyle=`rgba(255,255,240,${0.55*s})`;c.lineWidth=p.w*0.06*a[2];
    const oa=-p.w*0.22*a[2], ob=-p.w*0.22*b[2];c.beginPath();c.moveTo(a[0],a[1]+oa);c.lineTo(b[0],b[1]+ob);c.stroke();}
  c.restore();
}
function ribbonY(t,x){const p=ribbonParams(t),ph=t*0.9;return p.base+p.amp*Math.sin(p.freq*x+ph)+0.35*p.amp*Math.sin(p.freq*2.3*x-ph*0.6)}

/* ---------- floating cards ---------- */
const CO={spacex:{n:'SpaceX',c:C.sx,cat:'Aerospace',tk:'SX'},openai:{n:'OpenAI',c:C.oa,cat:'Artificial Intelligence',tk:'OA'},kalshi:{n:'Kalshi',c:C.kl,cat:'Prediction Markets',tk:'KL'}};
function coCard(c,key,x,y,rot,alpha,scale=1){
  if(alpha<=0)return; const w=330,h=128;
  c.save();c.globalAlpha=alpha;c.translate(x,y);c.rotate(rot);c.scale(scale,scale);
  c.shadowColor='rgba(40,50,20,0.18)';c.shadowBlur=40;c.shadowOffsetY=18;
  rr(c,-w/2,-h/2,w,h,24);c.fillStyle=key==='soon'?C.soon:CO[key].c;c.fill();c.shadowColor='transparent';
  if(key==='soon'){
    rr(c,-w/2+26,-34,68,68,16);c.fillStyle='#d3d0c6';c.fill();font(c,40,800);c.fillStyle='#ffffff';c.textAlign='center';c.textBaseline='middle';c.fillText('?',-w/2+60,2);
    c.fillStyle='#cfccc2';rr(c,-w/2+114,-30,150,22,11);c.fill();
    font(c,19,600,0.5);c.fillStyle=C.grey;c.textAlign='left';c.fillText('Coming soon',-w/2+114,20);
  }else{
    const im=ICON[key]; if(im.complete)c.drawImage(im,-w/2+22,-38,76,76);
    font(c,32,700);c.fillStyle=C.ink;c.textAlign='left';c.textBaseline='alphabetic';c.fillText(CO[key].n,-w/2+114,-2);
    font(c,19,500,0);c.fillStyle='#4f5249';c.fillText('Company exposure',-w/2+114,28);
  }
  c.restore();
}
function payCard(c,x,y,rot,alpha){
  if(alpha<=0)return;const w=440,h=270;c.save();c.globalAlpha=alpha;c.translate(x,y);c.rotate(rot);
  c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=50;c.shadowOffsetY=24;rr(c,-w/2,-h/2,w,h,26);
  const g=c.createLinearGradient(-w/2,-h/2,w/2,h/2);g.addColorStop(0,'#dcfda6');g.addColorStop(1,'#a9e15a');c.fillStyle=g;c.fill();c.shadowColor='transparent';
  font(c,40,700);c.fillStyle=C.ink;c.textAlign='left';c.textBaseline='alphabetic';c.fillText('Pay by card',-w/2+34,-h/2+70);
  c.strokeStyle=C.ink;c.lineWidth=5;c.lineCap='round';c.beginPath();c.moveTo(w/2-70,-h/2+52);c.lineTo(w/2-58,-h/2+64);c.lineTo(w/2-36,-h/2+38);c.stroke();
  rr(c,-w/2+34,-28,62,46,9);c.fillStyle='rgba(15,15,13,.18)';c.fill();
  font(c,26,600,6);c.fillStyle='rgba(15,15,13,.6)';c.fillText('•••• •••• ••••',-w/2+34,62);
  font(c,22,500,0);c.fillStyle='rgba(15,15,13,.7)';c.fillText('A simpler way to fund.',-w/2+34,h/2-30);
  c.restore();
}

/* ---------- phone ---------- */
const PW=440, PH=920, SW=PW-28, SH=PH-28;
function tap(c,x,y,t,at){const k=P(t,at,at+0.45);if(k<=0||k>=1)return;c.save();c.fillStyle=`rgba(120,120,120,${0.35*(1-k)})`;c.beginPath();c.arc(x,y,lerp(14,46,eo(k)),0,7);c.fill();c.restore()}
const press=(t,at)=>1-0.05*Math.sin(Math.PI*P(t,at,at+0.18));
function statusBar(c,dark){font(c,22,600,0);c.fillStyle=dark?'#fff':C.ink;c.textAlign='left';c.textBaseline='middle';c.fillText('9:41',40,34);
  c.fillRect(SW-82,28,26,13);c.fillRect(SW-50,26,30,16);}
function btn(c,x,y,w,h,label,t,at,{bg=C.ink,fg='#fff',size=26}={}){c.save();const s=at?press(t,at):1;c.translate(x+w/2,y+h/2);c.scale(s,s);
  rr(c,-w/2,-h/2,w,h,h/2);c.fillStyle=bg;c.fill();font(c,size,600,0);c.fillStyle=fg;c.textAlign='center';c.textBaseline='middle';c.fillText(label,0,2);c.restore();if(at)tap(c,x+w/2,y+h/2,t,at)}
function chip(c,x,y,w,label,sel,sub){rr(c,x,y,w,74,18);c.fillStyle=sel?C.ink:'#efece4';c.fill();font(c,26,700,0);c.fillStyle=sel?'#fff':C.ink;c.textAlign='center';c.textBaseline='middle';
  c.fillText(label,x+w/2,y+(sub?30:38));if(sub){font(c,13,600,1);c.fillStyle=sel?'#cfcfc8':C.grey;c.fillText(sub,x+w/2,y+56)}}
function coIcon(c,key,x,y,s){if(key==='soon'){rr(c,x,y,s,s,s*.24);c.fillStyle='#dcd9cf';c.fill();font(c,s*.55,800);c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.fillText('?',x+s/2,y+s/2+2);return}
  const im=ICON[key];if(im.complete)c.drawImage(im,x,y,s,s)}

// --- screens (drawn in screen coords, 0..SW x 0..SH) ---
function scrHome(c,t,o={}){
  c.fillStyle=C.paper;c.fillRect(0,0,SW,SH);statusBar(c,false);
  wordmark(c,32,118,38);
  c.fillStyle=C.lime;c.beginPath();c.arc(SW-58,104,30,0,7);c.fill();font(c,26,700);c.fillStyle=C.ink;c.textAlign='center';c.textBaseline='middle';c.fillText('K',SW-58,106);
  // balance card
  rr(c,24,160,SW-48,200,28);c.fillStyle='#ffffff';c.fill();c.strokeStyle=C.line;c.lineWidth=2;c.stroke();
  font(c,16,600,2);c.fillStyle=C.grey;c.textAlign='left';c.textBaseline='alphabetic';c.fillText('USDC BALANCE',52,206);
  font(c,64,800,-2);c.fillStyle=C.ink;c.fillText(o.balance??'$0.00',50,276);
  btn(c,50,296,SW-100,50,'Add funds  +',t,o.tapAdd,{size:22});
  font(c,30,800,-.5);c.fillStyle=C.ink;c.textAlign='left';c.fillText('Companies',32,418);
  const rows=['spacex','openai','kalshi','soon'];
  rows.forEach((k,i)=>{const y=444+i*112-(o.scroll||0);
    const hi=(o.highlight===k)?eo(P(t,o.hiAt,o.hiAt+0.4)):0;
    rr(c,24,y,SW-48,96,22);c.fillStyle=k==='soon'?mixc('#f1eee7','#ffffff',hi):'#ffffff';c.fill();c.strokeStyle=hi?mixc(C.line,C.limeDeep,hi):C.line;c.lineWidth=2+2*hi;c.stroke();
    if(o.tapRow===k){c.save();c.globalAlpha=0.5*Math.sin(Math.PI*P(t,o.tapAt,o.tapAt+0.3));rr(c,24,y,SW-48,96,22);c.fillStyle='#e9e6de';c.fill();c.restore()}
    coIcon(c,k,44,y+18,60);
    if(k==='soon'){c.fillStyle='#d9d6cc';rr(c,122,y+28,130,18,9);c.fill();font(c,17,500,0);c.fillStyle=C.grey;c.textAlign='left';c.textBaseline='alphabetic';c.fillText('Coming soon',122,y+72);
      const nk=o.notifyAt?P(t,o.notifyAt+0.15,o.notifyAt+0.4):0;
      btn(c,SW-190,y+26,142,44,nk>0.5?'✓ Notified':'Notify me',t,o.notifyAt,{bg:nk>0.5?C.lime:C.ink,fg:nk>0.5?C.ink:'#fff',size:18});}
    else{font(c,26,700,-.3);c.fillStyle=C.ink;c.textAlign='left';c.textBaseline='alphabetic';c.fillText(CO[k].n,122,y+46);font(c,17,500,0);c.fillStyle=C.grey;c.fillText(CO[k].cat,122,y+72);
      rr(c,SW-120,y+32,72,32,16);c.fillStyle=CO[k].c;c.fill();font(c,14,700,1);c.fillStyle=C.ink;c.textAlign='center';c.textBaseline='middle';c.fillText(CO[k].tk,SW-84,y+49);}
  });
  if(o.tapRow&&o.tapAt){tap(c,SW/2,444+rows.indexOf(o.tapRow)*112+48-(o.scroll||0),t,o.tapAt)}
}
function scrAddFunds(c,t,o){
  c.fillStyle=C.paper;c.fillRect(0,0,SW,SH);statusBar(c,false);
  font(c,24,700);c.fillStyle=C.ink;c.textAlign='center';c.textBaseline='alphabetic';wordmark(c,SW/2,104,30,C.ink,'center');
  font(c,42,800,-1);c.textAlign='left';c.fillStyle=C.ink;c.fillText('Add funds',32,176);font(c,19,500,0);c.fillStyle=C.grey;c.fillText('Funding amount',32,208);
  const sel=t>=o.tapSel+0.1, v=Math.round(lerp(50,250,eo(P(t,o.tapSel+0.05,o.tapSel+0.5))));
  font(c,96,800,-3);c.fillStyle=C.ink;c.textAlign='center';c.fillText('$'+v,SW/2,328);
  const cw=(SW-48-28)/3;[['$50','QUICK'],['$250','POPULAR'],['$1,000','CUSTOM']].forEach(([l,s],i)=>chip(c,24+i*(cw+14),370,cw,l,sel?i===1:i===0,s));
  tap(c,24+cw*1.5+14,407,t,o.tapSel);
  font(c,15,600,2);c.fillStyle=C.grey;c.textAlign='left';c.fillText('FUNDING METHOD',32,504);
  rr(c,24,522,SW-48,104,20);c.fillStyle='#fff';c.fill();c.strokeStyle=C.ink;c.lineWidth=2.5;c.stroke();
  c.beginPath();c.arc(64,574,13,0,7);c.strokeStyle=C.ink;c.lineWidth=3;c.stroke();c.beginPath();c.arc(64,574,6,0,7);c.fillStyle=C.ink;c.fill();
  font(c,26,700,-.3);c.fillStyle=C.ink;c.fillText('Banxa',96,566);font(c,17,500,0);c.fillStyle=C.grey;c.fillText('Card, Apple Pay, Google Pay',96,594);
  btn(c,24,664,SW-48,82,'Continue to Banxa',t,o.tapGo,{size:26});
  font(c,15,500,0);c.fillStyle=C.grey;c.textAlign='center';c.fillText('Fund your wallet with USDC on Solana.',SW/2,790);c.fillText('Provider fees and verification apply.',SW/2,814);
}
function scrBuy(c,t,o){
  c.fillStyle=C.paper;c.fillRect(0,0,SW,SH);statusBar(c,false);
  font(c,28,400);c.fillStyle=C.ink;c.textAlign='left';c.textBaseline='middle';c.fillText('‹',30,104);
  coIcon(c,'spacex',SW/2-110,78,52);font(c,28,700,-.3);c.textBaseline='alphabetic';c.fillText('T-SpaceX',SW/2-46,104);font(c,15,500,0);c.fillStyle=C.grey;c.fillText('Aerospace · SpaceX exposure',SW/2-46,126);
  font(c,20,600,0);c.fillStyle=C.grey;c.textAlign='center';c.fillText('How much will you buy?',SW/2,232);
  const sel=t>=o.tapOne+0.08; const amt=sel?'$1.00':'$0';
  const s=sel?lerp(1.25,1,back(P(t,o.tapOne+0.08,o.tapOne+0.5))):1;
  c.save();c.translate(SW/2,330);c.scale(s,s);font(c,110,800,-4);c.fillStyle=sel?C.ink:'#c9c6bc';c.fillText(amt,0,0);c.restore();
  const cw=(SW-48-36)/4;['$1','$25','$100','$500'].forEach((l,i)=>{rr(c,24+i*(cw+12),380,cw,60,30);c.fillStyle=(sel&&i===0)?C.ink:'#efece4';c.fill();
